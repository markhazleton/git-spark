name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and create deployment record"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
    publish:
        name: Publish Package
        runs-on: ubuntu-latest

        permissions:
            contents: write # create the GitHub Release after npm publish
            id-token: write
            deployments: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "26.x"
                  cache: "npm"
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: npm ci

            - name: Generate version file
              run: npm run prebuild

            - name: Run tests
              run: npm run test:coverage

            - name: Run linting
              run: npm run lint

            - name: Build project
              run: npm run build

            - name: Verify package contents
              run: |
                  npm pack --dry-run
                  npx publint

            - name: Manual validation mode
              if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
              run: |
                  echo "Manual validation run: skipping npm publish and deployment creation."

            - name: Publish to NPM
              if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
              run: npm publish --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub Release
              if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION=$(node -p 'require("./package.json").version')
                  TAG="v${VERSION}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "GitHub Release $TAG already exists, skipping"
                    exit 0
                  fi
                  node scripts/extract-release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"
                  gh release create "$TAG" \
                    --verify-tag \
                    --title "Git Spark $TAG" \
                    --notes-file "$RUNNER_TEMP/release-notes.md"

            - name: Create GitHub deployment
              if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
              uses: actions/github-script@v7
              with:
                  script: |
                      let releaseTag = context.ref.replace('refs/tags/', '');
                      if (context.eventName === 'workflow_dispatch') {
                        releaseTag = `v${require('./package.json').version}`;
                      }
                      let description = `Deployed version ${releaseTag} to NPM`;
                      
                      try {
                        const { data: release } = await github.rest.repos.getReleaseByTag({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          tag: releaseTag
                        });
                        description = `Deployed version ${release.tag_name} to NPM`;
                      } catch (e) {
                        console.log('No release found for tag, using tag name');
                      }

                      await github.rest.repos.createDeployment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: context.sha,
                        environment: 'npm',
                        description: description,
                        auto_merge: false,
                        required_contexts: []
                      });

    notify:
        name: Notify Success
        runs-on: ubuntu-latest
        needs: publish
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Extract version from tag
              id: version
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                    echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
                  else
                    echo "VERSION=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT
                  fi

            - name: Notify Discord (if webhook configured)
              if: vars.DISCORD_WEBHOOK_URL
              run: |
                  curl -H "Content-Type: application/json" \
                       -d "{\"content\":\"🚀 Git Spark v${{ steps.version.outputs.VERSION }} has been published to NPM!\\n\\nhttps://www.npmjs.com/package/git-spark\"}" \
                       ${{ vars.DISCORD_WEBHOOK_URL }}

    rollback:
        name: Rollback on Failure
        runs-on: ubuntu-latest
        needs: publish
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}

        permissions:
            contents: read
            issues: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Extract version from tag
              id: version
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                    echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
                  else
                    echo "VERSION=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT
                  fi

            - name: Open issue for manual intervention
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.VERSION }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  echo "⚠️ Publication failed for version ${VERSION}"
                  gh issue create \
                    --title "Publish failed for v${VERSION}" \
                    --body "The publish workflow failed for \`v${VERSION}\`: ${RUN_URL}

                  Check the failed step before re-running:
                  - Before \`npm publish\` (tests, lint, build): fix and re-tag, or re-run the workflow.
                  - At \`npm publish\`: an \`E404\`/\`E401\` on PUT usually means \`NPM_TOKEN\` is expired or invalid. Rotate the secret and re-run. Confirm with \`npm view git-spark versions\`.
                  - After \`npm publish\` (GitHub Release or deployment): the package is already live, so do not re-run (npm rejects republishing a version). Create the release by hand: \`node scripts/extract-release-notes.js ${VERSION} > notes.md && gh release create v${VERSION} --verify-tag --title 'Git Spark v${VERSION}' --notes-file notes.md\`"
